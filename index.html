<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>K线策略游戏</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <!-- 顶部：回合信息 + 本回合新闻 -->
    <header id="topbar">
      <div class="stats">
        <span class="turn" id="turnLabel">第 1/20 回合</span>
        <span>总资产 <b id="statAssets">—</b></span>
        <span>现金 <b id="statCash">—</b></span>
        <span>研究点 <b id="statPoints">—</b></span>
        <span class="top-actions">
          <button class="link-btn" id="btnHistory" title="查看之前任意回合的新闻、研究与结果">回合历史</button>
          <button class="link-btn" id="btnRules" title="查看规则说明">规则</button>
          <button class="link-btn" id="btnRestart" title="放弃当前对局，重新开始">重新开始</button>
          <button class="link-btn danger" id="btnQuit" title="自动存档后退出游戏">退出游戏</button>
        </span>
      </div>
      <div class="goal" id="goalBox"></div>
      <div class="news" id="newsBox"></div>
    </header>

    <main id="main">
      <!-- 左：公司列表 -->
      <aside id="companyList"></aside>

      <!-- 中：K线（只显示已经过去的日K） -->
      <section id="chartArea">
        <div class="chart-title" id="chartTitle"></div>
        <div id="mainChart" class="chart c-main"><div class="ch-label" title="黄/蓝/紫线：5 日、10 日、20 日移动平均线；橙色细线：布林带（20 日，上轨/中轨/下轨）"><i style="background:#f5a623"></i>MA5 <i style="background:#42a5f5"></i>MA10 <i style="background:#ce93d8"></i>MA20 <i style="background:#b9852c"></i>布林带</div></div>
        <div id="volumeChart" class="chart c-vol"><div class="ch-label" title="每个交易日的成交量，红色=当日收涨，绿色=当日收跌">成交量</div></div>
        <div id="macdChart" class="chart c-macd"><div class="ch-label" title="MACD（12,26,9）：趋势指标。柱子在 0 轴上方偏多、下方偏空；蓝/橙两条线是 DIF 与 DEA">MACD（12,26,9）</div></div>
        <div id="rsiChart" class="chart c-rsi"><div class="ch-label" title="RSI（14）：强弱指标，0–100。通常 >70 视为偏热、<30 视为偏冷">RSI（14）</div></div>
      </section>

      <!-- 右：研究 + 下单 -->
      <aside id="sidePanel">
        <div class="panel" id="researchPanel"></div>
        <div class="panel" id="orderPanel"></div>
        <div class="panel" id="pendingPanel"></div>
        <div class="panel log" id="logPanel"></div>
      </aside>
    </main>

    <footer id="bottombar">
      <span id="footHint">订单将在下周一开盘价成交（先卖后买，T+1，涨停买不进、跌停卖不出）</span>
      <span class="ver" id="verTag"></span>
      <button id="btnEndTurn" class="primary">结束回合 ▶</button>
    </footer>
  </div>

  <!-- 结算界面 -->
  <div id="settlement" class="overlay" hidden></div>
  <!-- 复盘页 -->
  <div id="review" class="overlay review" hidden></div>
  <!-- 研究后相关新闻 -->
  <div id="newsPop" class="overlay weekly" hidden></div>
  <!-- 季度成绩单 -->
  <div id="quarter" class="overlay weekly" hidden></div>
  <!-- 回合历史 -->
  <div id="history" class="overlay weekly" hidden></div>
  <!-- 回合小结 -->
  <div id="weekly" class="overlay weekly" hidden></div>
  <!-- 规则说明 -->
  <div id="rules" class="overlay rules" hidden></div>

  <script src="lib/lightweight-charts.js"></script>
  <script src="js/game/config.js"></script>
  <script src="js/game/rng.js"></script>
  <script src="js/game/companies.js"></script>
  <script src="js/game/events.js"></script>
  <script src="js/game/scoring.js"></script>
  <script src="js/game/advice.js"></script>
  <script src="js/game/market.js"></script>
  <script src="js/game/research.js"></script>
  <script src="js/game/trading.js"></script>
  <script src="js/game/game-state.js"></script>
  <script src="js/game/record.js"></script>
  <script src="js/game/summary.js"></script>
  <script src="js/chart.js"></script>
  <script src="js/ui/tips.js"></script>
  <script src="js/ui/save.js"></script>
  <script src="js/ui/view.js"></script>
  <script src="js/ui/replay.js"></script>
  <script src="js/ui/review.js"></script>
  <script src="js/ui/weekly.js"></script>
  <script src="js/ui/history.js"></script>
  <script src="js/ui/rules.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
